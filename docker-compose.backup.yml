# =============================================================================
# docker-compose.backup.yml — Sauvegarde / DR de la base SQL Server
# -----------------------------------------------------------------------------
#   - db-backup : backup natif planifié (BACKUP + RESTORE VERIFYONLY + rétention)
#     vers ./backups sur l'hôte. Identifiants dérivés de DATABASE_URL (aucun
#     secret dupliqué).
#
# Usage :
#   make backup:up            → service planifié (backup immédiat puis /24h)
#   make backup:now           → backup manuel immédiat
#   make backup:test-restore  → drill DR (restauration sur instance de TEST)
# =============================================================================
services:
  db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: audit-db-backup
    environment:
      # Base à sauvegarder (les identifiants sont extraits de cette URL)
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requise (voir .env)}
      # Où écrire le .bak : chemin SIDE SERVEUR SQL (partage UNC ou dossier
      # local du serveur). Le compte du service SQL Server doit pouvoir y écrire.
      BACKUP_DEST: '${BACKUP_DEST:?BACKUP_DEST requis : chemin côté SERVEUR SQL (ex: partage UNC ou D:\Backups)}'
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      DB_NAME: ${DB_NAME:-AuditDB}
    volumes:
      # Utilisé par le drill DR (restore-test.sh) : y déposer le .bak à tester
      - ./backups:/backups
    extra_hosts:
      # Résout le nom AD/NetBIOS du serveur SQL (même correctif que
      # docker-compose.external-db.yml : le DNS Docker ne résout pas ces noms)
      # Surchargeable via SQL_HOST_EXTRA / SQL_HOST_EXTRA_IP
      - "${SQL_HOST_EXTRA:-DLADIR2017}:${SQL_HOST_EXTRA_IP:-192.168.2.17}"
      # Permet au drill DR d'atteindre une instance de test sur l'hôte
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
