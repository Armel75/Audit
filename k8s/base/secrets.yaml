# =============================================================================
# Secrets de l'application Audit
# ⚠️  stringData est encodé automatiquement par Kubernetes.
# ⚠️  À ADAPTER avec vos valeurs réelles de production avant `kubectl apply`.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: audit-secrets
  namespace: audit
type: Opaque
stringData:
  # ── Base de données SQL Server EXTERNE (hors cluster) ────────────────────
  # NB : utiliser l'IP (ex: 192.168.2.17 = DLADIR2017) — les noms NetBIOS/AD
  # ne sont pas résolus par le DNS interne du cluster.
  DATABASE_URL: "sqlserver://192.168.2.17:51269;database=AuditDB;user=sa;password=CHANGE_ME;encrypt=true;trustServerCertificate=true"

  # ── Authentification / sécurité ───────────────────────────────────────────
  JWT_SECRET: "CHANGE_ME-super-secret-jwt"
  BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME"

  # ── IA (optionnel) ────────────────────────────────────────────────────────
  GEMINI_API_KEY: ""

  # ── GLPI (optionnel) ──────────────────────────────────────────────────────
  GLPI_DB_PASSWORD: ""

  # ── SMTP (optionnel) ──────────────────────────────────────────────────────
  SMTP_PASS: ""
