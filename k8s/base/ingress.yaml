# =============================================================================
# Ingress — exposition de l'application
# Le pod web (Nginx) est l'ENTRÉE unique : il sert /audit/ (statique), proxifie
# /api/audit et /storage vers l'API. On route donc TOUT le trafic vers web:80,
# ce qui reproduit exactement http://localhost/audit en docker-compose.
#
# NB : Traefik est le contrôleur Ingress par défaut de k3s (IngressClass
# "traefik"). Si vous utilisez nginx-ingress, remplacer par :
#   annotations: kubernetes.io/ingress.class: nginx
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audit-ingress
  namespace: audit
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
