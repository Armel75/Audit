# =============================================================================
# Overlay PRODUCTION — SISAR Audit
# Déclenché par tag `v*` (ou dispatch manuel). Images immuables taguées SHA.
# Protection d'environnement (required reviewers) à activer dans GitHub.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: audit

images:
  - name: audit-api
    newName: ghcr.io/CHANGE_ME/audit-api
    newTag: latest
  - name: audit-web
    newName: ghcr.io/CHANGE_ME/audit-web
    newTag: latest

patches:
  # Pull depuis le registre privé (secret à créer, voir README)
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
