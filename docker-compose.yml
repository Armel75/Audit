# =============================================================================
# docker-compose.yml — SISAR Audit (Développement)
# =============================================================================

x-common-env: &common-env
  NODE_ENV: development

services:
  # ── Base de données SQL Server ─────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: audit-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-DevPassword123!}
      MSSQL_PID: Developer
      MSSQL_TCP_PORT: 1433
      MSSQL_LCID: 1036
      MSSQL_COLLATION: Latin1_General_CI_AS
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      # Scripts d'init SQL exécutés manuellement via sqlcmd si besoin
      # La création des tables est gérée par les migrations Prisma au démarrage de l'API
      - ./db/init:/scripts/init:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-DevPassword123!}" -C -Q "SELECT 1"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - audit-network

  # ── API Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: audit-api
    # Mémoire partagée agrandie pour Chromium/Puppeteer (sinon crash au rendu PDF)
    shm_size: "1gb"
    environment:
      <<: *common-env
      API_PORT: 3007
      # ── Connexion à la base de données ─────────────────────────────────
      # ✅ BASE LOCALE (conteneur SQL Server Docker) — ACTIVE par défaut
      DATABASE_URL: "sqlserver://sqlserver:1433;database=AuditDB;user=sa;password=${SA_PASSWORD:-DevPassword123!};encrypt=true;trustServerCertificate=true"
      # 🔄 BASE EXTERNE (production, depuis le .env) — décommentez pour basculer :
      # DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:80}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BOOTSTRAP_ENABLED: "true"
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@audit.local}
      BOOTSTRAP_TENANT_ID: "1"
      BOOTSTRAP_ADMIN_ROLE: SUPER_ADMIN
      STORAGE_PATH: /app/.storage
      GLPI_DB_HOST: ${GLPI_DB_HOST:-}
      GLPI_DB_PORT: ${GLPI_DB_PORT:-3306}
      GLPI_DB_USER: ${GLPI_DB_USER:-}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:-}
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "${API_PORT:-3007}:3007"
    volumes:
      - api_storage:/app/.storage
      - ./db/init:/scripts/init:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audit-network

  # ── Frontend Web (servi par Nginx) ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: audit-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - audit-network

volumes:
  sqlserver_data:
    driver: local
  api_storage:
    driver: local

networks:
  audit-network:
    driver: bridge
