name: CI — Audit Pipeline

on:
  push:
    branches: [main, develop, developpement]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── Job 1 : Qualité & lint ──────────────────────────────────────────
  lint:
    name: 🔍 Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run prisma:generate

      - name: TypeScript Check — API
        run: cd apps/api && npx tsc --noEmit

      - name: TypeScript Check — Web
        run: cd apps/web && npx tsc --noEmit

  # ── Job 2 : Tests unitaires + couverture ──────────────────────────
  test:
    name: 🧪 Tests unitaires + couverture
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run prisma:generate

      - name: Tests unitaires (Vitest)
        run: npm run test:unit

      - name: Gate de couverture (API unitaire)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ── Job 2 bis : Sécurité (dépendances + scan fichiers) ──────────────────
  security:
    name: 🔒 Sécurité (npm audit + Trivy)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # Audit des dépendances — NON BLOQUANT au départ (baseline à assainir).
      # NB : registre officiel requis (le miroir npmmirror n'implémente pas
      # l'audit ; npmjs est bloqué par le pare-feu local mais accessible ici).
      - name: npm audit (dépendances)
        run: |
          npm audit --audit-level=high --registry=https://registry.npmjs.org \
            || echo "⚠️ Vulnérabilités HIGH/CRITICAL détectées — voir le log ci-dessus"

      # Scan Trivy du dépôt (package-lock.json, Dockerfiles, manifests k8s)
      - name: Trivy — scan fichiers
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

  # ── Job 3 : Build complet ─────────────────────────────────────────
  build:
    name: 🏗️ Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/audit' }}

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

  # ── Job 4 : Build Docker & Scan ──────────────────────────────────
  docker:
    name: 🐳 Docker Build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: audit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: true
          tags: audit-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans Trivy des images construites (non bloquant au départ)
      - name: Trivy — scan image API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: audit-api:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Trivy — scan image Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: audit-web:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: ✅ Docker images built successfully
        run: |
          docker images audit-api:ci
          docker images audit-web:ci
