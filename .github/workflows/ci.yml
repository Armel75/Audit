name: CI — Audit Pipeline

on:
  push:
    branches: [main, develop, developpement]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── Job 1 : Qualité & lint ──────────────────────────────────────────
  lint:
    name: 🔍 Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run prisma:generate

      - name: TypeScript Check — API
        run: cd apps/api && npx tsc --noEmit

      - name: TypeScript Check — Web
        run: cd apps/web && npx tsc --noEmit

  # ── Job 2 : Build complet ───────────────────────────────────────────
  build:
    name: 🏗️ Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/audit' }}

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

  # ── Job 3 : Build Docker & Scan ────────────────────────────────────
  docker:
    name: 🐳 Docker Build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: audit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: audit-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Docker images built successfully
        run: |
          docker images audit-api:ci
          docker images audit-web:ci
