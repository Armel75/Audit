# =============================================================================
# AppProject — SISAR Audit (GitOps)
# Restreint les déploiements ArgoCD aux namespaces du projet sur le cluster
# interne (https://kubernetes.default.svc).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: audit
  namespace: argocd
spec:
  description: SISAR Audit — applications GitOps
  # Dépôt source autorisé (à adapter : votre repo Git)
  sourceRepos:
    - 'https://github.com/CHANGE_ME/audit.git'

  # Destinations autorisées (namespace staging + prod sur le cluster interne)
  destinations:
    - server: https://kubernetes.default.svc
      namespace: audit-staging
    - server: https://kubernetes.default.svc
      namespace: audit

  # Permissions minimales : création des Namespaces uniquement
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
