# =============================================================================
# Grafana — fournisseur de dashboards (provisionné)
# =============================================================================
apiVersion: 1

providers:
  - name: 'SISAR Audit'
    orgId: 1
    folder: 'SISAR'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
